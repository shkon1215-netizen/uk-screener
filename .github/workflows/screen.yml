name: Run screen and publish

# The LSE closes at 16:30 London time. This runs at 17:00 UTC Mon-Fri, which is
# after the close year-round: in winter London is UTC and 17:00 UTC is 17:00
# local; in BST it is 18:00 local. Cron here is UTC and does not observe BST,
# so scheduling after the later of the two keeps a single expression correct in
# both halves of the year rather than drifting into the session each summer.
on:
  schedule:
    - cron: "0 17 * * 1-5"
  workflow_dispatch:        # lets you trigger a run by hand from the Actions tab
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

permissions:
  contents: read
  pages: write
  id-token: write

# A scheduled run and a manual one must not publish over each other.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pandas<3"

      - name: Offline logic check
        run: python test_uk.py

      # Yahoo rate-limits by IP and shared runner addresses are already busy,
      # so this is the step most likely to fail in CI while working locally.
      # main_uk.py refuses to screen a partial universe rather than publishing
      # a thin one, so a retry after a pause is the right recovery: the
      # per-day cache in .uk_cache keeps whatever arrived on the first attempt,
      # and the second run only asks for the gaps.
      #
      # The cache lives in the workspace, so it survives between these two
      # steps but not between workflow runs - which is correct, since a new
      # run wants a fresh session date anyway.
      - name: Screen Main Market
        id: main
        continue-on-error: true
        run: |
          python main_uk.py --board MAIN --skip-liquidity --all \
            --out uk_screen_results.csv --dashboard ""

      - name: Screen Main Market (retry after rate-limit pause)
        if: steps.main.outcome == 'failure'
        run: |
          echo "First attempt failed - most likely Yahoo throttling. Pausing."
          sleep 180
          python main_uk.py --board MAIN --skip-liquidity --all \
            --out uk_screen_results.csv --dashboard ""

      # AIM is allowed to fail without taking the Main Market page down with
      # it. It is 25 names past the size gate; the Main Market screen is the
      # product.
      - name: Screen AIM
        continue-on-error: true
        run: |
          python main_uk.py --board AIM --skip-liquidity --all \
            --out aim_screen_results.csv --dashboard ""

      - name: Build site
        run: python build_site.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
